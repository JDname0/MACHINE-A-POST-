    import React, { useState, useRef, useEffect } from 'react';

    const EASE = [0.25, 0.1, 0.25, 1];

    const BASE_NAV_LINKS = [
      { label: 'Accueil', href: 'index.html' },

    function FadeIn({ children, delay = 0, duration = 0.7, x = 0, y = 30, as = 'div', className }) {
      const MotionTag = motion[as];
      return html`<${MotionTag} className=${className} initial=${{ opacity: 0, x, y }} whileInView=${{ opacity: 1, x: 0, y: 0 }} viewport=${{ once: true, margin: '50px', amount: 0 }} transition=${{ delay, duration, ease: EASE }}>${children}<//>`;
    }

    function NavDropdown({ label, items, itemClassName }) {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      useEffect(() => { function h(e) { if (ref.current && !ref.current.contains(e.target)) setOpen(false); } document.addEventListener('mousedown', h); return () => document.removeEventListener('mousedown', h); }, []);
      return html`<div ref=${ref} className="relative"><button type="button" onClick=${() => setOpen((o) => !o)} className=${`${itemClassName} gap-1.5`}>${label}<span className="inline-block text-[0.7em] transition-transform duration-200" style=${{ transform: open ? 'rotate(180deg)' : 'rotate(0deg)' }}>▾</span></button>${open ? html`<div className="absolute left-1/2 -translate-x-1/2 sm:left-0 sm:translate-x-0 top-full mt-2 min-w-[220px] rounded-2xl border border-[#D7E2EA]/20 bg-[#0C0C0C]/95 backdrop-blur-md shadow-[0_12px_40px_rgba(0,0,0,0.5)] overflow-hidden z-50">${items.map((item) => html`<a key=${item.label} href=${item.href} className="block px-5 py-3.5 text-[#D7E2EA] text-xs sm:text-sm font-medium uppercase tracking-wider transition-colors duration-150 hover:bg-[#D7E2EA]/10 border-b border-[#D7E2EA]/10 last:border-b-0">${item.label}</a>`)}</div>` : null}</div>`;
    }


    const SILVER = [0.729, 0.800, 0.839];
    const VIOLET = [0.714, 0.0, 0.659];

    const SIMPLEX_GLSL = `
      vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
      vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
      vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
      vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
      float snoise(vec3 v){
        const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
        vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
        vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g;
        vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
        vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
        i=mod289(i);
        vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
        float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
        vec4 j=p-49.0*floor(p*ns.z*ns.z);
        vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
        vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy;
        vec4 h=1.0-abs(x)-abs(y);
        vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
        vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0;
        vec4 sh=-step(h,vec4(0.0));
        vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
        vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
        vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
        p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
        vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
        return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
      }
    `;

    function AmbientField() {
      const mountRef = useRef(null);
      useEffect(() => {
        const mount = mountRef.current;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 5;
        let renderer;
        try {
          renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        } catch (e) { console.warn('[AmbientField] WebGL indisponible', e); return; }
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.domElement.style.position = 'fixed';
        renderer.domElement.style.inset = '0';
        mount.appendChild(renderer.domElement);

        const N = 450;
        const positions = new Float32Array(N * 3);
        const sizes = new Float32Array(N);
        const brightness = new Float32Array(N);
        for (let i = 0; i < N; i++) {
          positions[i * 3] = (Math.random() - 0.5) * 60;
          positions[i * 3 + 1] = (Math.random() - 0.5) * 30;
          positions[i * 3 + 2] = Math.random() * -30 - 8;
          sizes[i] = Math.random() < 0.5 ? 1.2 : 0.5;
          brightness[i] = 0.85 + Math.random() * 0.3;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        geo.setAttribute('brightness', new THREE.BufferAttribute(brightness, 1));

        const vertexShader = `
          attribute float size;
          attribute float brightness;
          varying vec3 vColor;
          varying float vBrightness;
          varying float vDepth;
          varying float vProximity;
          uniform float uTime;
          uniform float uScroll;
          uniform vec2 uCursor;
          uniform float uHover;
          uniform float uAspect;
          ${SIMPLEX_GLSL}
          void main() {
            vBrightness = brightness;
            vec3 pos = position;
            float seed = fract(sin(dot(position.xy, vec2(12.9898,78.233))) * 43758.5453);

            pos.y += cos(uTime * 0.282 + seed * 1.5) * 0.5;
            pos.z += sin(uTime * 0.28 + seed * 2.0) * 0.8;
            pos.x += sin(uTime * 0.84 + position.z * 2.0) * 0.2;
            pos.y += cos(uTime * 0.63 + position.x * 1.5) * 0.25;
            pos.x += sin(uScroll * 5.0 + position.y * 0.5) * 3.0;
            pos.y += cos(uScroll * 4.0 + position.x * 0.3) * 2.5;
            pos.z += sin(uScroll * 3.5 + position.z * 0.4) * 2.0;

            float noiseScale = 0.7;
            float drift = uTime * 0.02;
            float n1 = snoise(position * noiseScale + drift);
            float n2 = snoise(position * noiseScale * 2.1 + vec3(37.0,91.0,54.0) + drift * 0.7);
            float n3 = snoise(position * noiseScale * 4.3 + vec3(150.0,23.0,77.0) + drift * 0.4);
            float combined = n1 * 0.6 + n2 * 0.3 + n3 * 0.1;
            float zone = combined * 0.5 + 0.5;

            vec3 silverC = vec3(${SILVER[0]}, ${SILVER[1]}, ${SILVER[2]});
            vec3 violetC = vec3(${VIOLET[0]}, ${VIOLET[1]}, ${VIOLET[2]});
            vec3 whiteC = vec3(1.0,1.0,1.0);
            float silverWeight = 1.0 - smoothstep(0.39, 0.45, zone);
            float whiteWeight = smoothstep(0.62, 0.68, zone);
            float violetWeight = max(1.0 - silverWeight - whiteWeight, 0.0);
            vColor = silverC * silverWeight + violetC * violetWeight + whiteC * whiteWeight;

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            float depth = -mvPosition.z;
            vec2 cursorView = uCursor * depth * vec2(0.767 * uAspect, 0.767);
            vec2 diff = mvPosition.xy - cursorView;
            float d = length(diff);
            float repelRadius = depth * 0.8;
            float influence = pow(1.0 - smoothstep(0.0, repelRadius, d), 2.0) * uHover;
            vec2 radial = normalize(diff + 0.001);
            vec2 tangent = vec2(-radial.y, radial.x);
            vec2 displacement = (radial * 0.6 + tangent * 0.4) * influence * depth * 0.07;
            mvPosition.xy += displacement;

            vProximity = influence;
            vDepth = clamp(-mvPosition.z / 35.0, 0.0, 1.0);

            float sizeBoost = 1.0 + influence * 0.5;
            gl_PointSize = size * sizeBoost * (120.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
          }
        `;
        const fragmentShader = `
          varying vec3 vColor;
          varying float vBrightness;
          varying float vDepth;
          varying float vProximity;
          void main() {
            vec2 center = gl_PointCoord - 0.5;
            float dist = length(center);
            float alpha = 1.0 - smoothstep(0.15, 0.45, dist);
            float depthFade = mix(1.0, 0.1, vDepth);
            float finalAlpha = alpha * vBrightness * depthFade * (0.55 + vProximity * 0.6);
            vec3 glow = vColor * (1.0 + vProximity * 0.8);
            gl_FragColor = vec4(glow, finalAlpha);
          }
        `;

        const material = new THREE.ShaderMaterial({
          uniforms: { uTime: { value: 0 }, uScroll: { value: 0 }, uCursor: { value: new THREE.Vector2(0, 0) }, uHover: { value: 0 }, uAspect: { value: window.innerWidth / window.innerHeight } },
          vertexShader, fragmentShader,
          transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        });
        const points = new THREE.Points(geo, material);
        scene.add(points);

        const mouse = { x: 0, y: 0, hover: 0 };
        function onMouseMove(e) { mouse.x = e.clientX / window.innerWidth * 2 - 1; mouse.y = -(e.clientY / window.innerHeight) * 2 + 1; mouse.hover = 1; }
        function onMouseLeave() { mouse.hover = 0; }
        window.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseleave', onMouseLeave);

        let raf;
        const clock = new THREE.Clock();
        function animate() {
          const t = clock.getElapsedTime();
          material.uniforms.uTime.value = t;
          material.uniforms.uScroll.value = window.scrollY * 0.0006;
          material.uniforms.uCursor.value.set(mouse.x, mouse.y);
          material.uniforms.uHover.value += (mouse.hover - material.uniforms.uHover.value) * 0.06;
          renderer.render(scene, camera);
          raf = requestAnimationFrame(animate);
        }
        animate();

        function onResize() {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          material.uniforms.uAspect.value = window.innerWidth / window.innerHeight;
        }
        window.addEventListener('resize', onResize);

        return () => {
          cancelAnimationFrame(raf);
          window.removeEventListener('resize', onResize);
          window.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseleave', onMouseLeave);
          mount.removeChild(renderer.domElement);
          geo.dispose(); material.dispose(); renderer.dispose();
        };
      }, []);
      return html`<div ref=${mountRef} style=${{ position: 'fixed', inset: 0, zIndex: 0, pointerEvents: 'none' }}></div>`;
    }

    const SCRAMBLE_ON = new URLSearchParams(window.location.search).get('scramble') !== '0';
    const SCRAMBLE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+=<>/';

    }

    const ARTICLES = [
      { cat: '3D', catClass: 'tag-3d', title: 'Publicité 3D produit : comment ça marche vraiment', desc: "Packshot, animation, spot — on démonte le process de A à Z. Modélisation, shading, rendu : ce que ça coûte vraiment et quand c'est rentable.", date: 'Sept 2026', href: 'blog-publicite-3d-produit.html', img: 'blog-img-pub3d.jpg', alt: 'Flacons modélisés en 3D en lévitation sur fond violet' },
      { cat: '3D', catClass: 'tag-3d', title: 'Packshot 3D vs photo produit : lequel choisir en 2026 ?', desc: "Coûts, délais, flexibilité, rendu final — une comparaison honnête pour aider les marques à prendre la bonne décision.", date: 'Oct 2026', href: 'blog-packshot-3d.html', img: 'blog-img-packshot.jpg', alt: 'Socle de présentation produit doré dans une lumière douce' },
      { cat: '3D', catClass: 'tag-3d', title: 'Animation 3D publicitaire : prix et process en 2026', desc: "Ce que coûte réellement une animation 3D pour les réseaux sociaux ou la TV — avec des exemples de budgets selon la complexité.", date: 'Nov 2026', href: 'blog-animation-3d-publicitaire.html', img: 'blog-img-animation.jpg', alt: 'Composition de formes géométriques 3D colorées sur fond violet' },
      { cat: 'Web', catClass: 'tag-web', title: 'Site vitrine sur mesure vs template : vrai comparatif', desc: "Squarespace, Webflow ou développement custom — lequel choisir vraiment en fonction du budget, des objectifs et du niveau de contrôle attendu.", date: 'Oct 2026', href: 'blog-site-vitrine-sur-mesure.html', img: 'blog-img-site-vitrine.jpg', alt: "Page d'accueil d'un créateur de sites affichée sur un écran d'ordinateur" },
      { cat: 'Web', catClass: 'tag-web', title: 'Créer un site vitrine professionnel en 2026 : guide complet', desc: "Stack technique, design, SEO, budget — les étapes concrètes pour créer un site vitrine qui travaille vraiment pour votre activité.", date: 'Nov 2026', href: 'blog-creation-site-vitrine.html', img: 'blog-img-creation-site.jpg', alt: 'Maquette filaire de site web dessinée à la main dans un carnet' },
      { cat: 'Web', catClass: 'tag-web', title: 'Agence web ou freelance : comment choisir pour son site ?', desc: "Prix, délais, engagement, qualité — comparatif complet pour choisir le bon type de prestataire selon vos vrais besoins.", date: 'Nov 2026', href: 'blog-agence-web-freelance.html', img: 'blog-img-agence-web.jpg', alt: 'Ordinateur portable ouvert devant un mur de notes de projet colorées' },

    function ArticleCard({ article, index }) {
      return html`
        <${motion.div}
          layout
          initial=${{ opacity: 0, y: 24 }}
          animate=${{ opacity: 1, y: 0 }}

        >
          <a

          >
            <div className="relative overflow-hidden" style=${{ aspectRatio: '16 / 9' }}>
